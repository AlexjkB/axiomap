name: Release

# Dormant until docs/RELEASING.md's one-time setup is done: this needs the
# `axiomap` npm scope and VS Code Marketplace/Open VSX publisher registered,
# and NPM's trusted-publisher OIDC (or an NPM_TOKEN fallback) plus VSCE_PAT and
# OVSX_PAT configured as repository secrets. Until then this workflow runs and
# no-ops (`changesets/action` opens no PR and publishes nothing when there is
# nothing pending), which is deliberate — see docs/RELEASING.md.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for `npm publish --provenance` via OIDC trusted publishing —
  # decision #7's supply-chain attestation, without a long-lived npm token
  # sitting in repository secrets.
  id-token: write

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      # §7 Phase 9 gates: the same checks CI's own jobs run, repeated here
      # because a release can be triggered by a merge this job did not
      # itself review.
      - run: pnpm check
      - run: pnpm check:network
      - run: pnpm check:licences
      - run: pnpm notices:check
      - run: pnpm verify:npm-pack

      # Opens or updates a "Version Packages" PR when changesets are pending;
      # once that PR is merged (so this step runs with none pending), it
      # publishes every bumped, non-ignored package to npm instead.
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-extension:
    name: publish to VS Code Marketplace and Open VSX
    needs: release
    # Only right after `changesets/action` actually published to npm — not on
    # every push, and not on the merge that only opens the "Version Packages" PR.
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notices:check
      - run: pnpm build
      - run: pnpm package:vsix
      - run: pnpm verify:vsix
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath dist/*.vsix -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx ovsx publish dist/*.vsix -p "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
