name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build + test + lint
    runs-on: ubuntu-latest
    steps:
      # Tags, not just the tip: `defi-v1` and `defi-v2` are the §14 diff
      # fixture, and Phase 5's exit criterion diffs one against the other. A
      # shallow checkout without them fails the suite rather than skipping it,
      # which is deliberate but only useful if CI actually has them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  network-invariant:
    name: zero network dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:network

  # §7's Phase 9: "the sibling of the network-dependency check from §3 — same
  # pattern, same enforcement". Its own job for the same reason that one has
  # one: a licence conflict is a fact about the dependency tree, and reading it
  # in a red build beside a hundred passing tests is not the same as reading it
  # as the thing that failed.
  licences:
    name: licence compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licences

  # §7's Phase 8: "installable `.vsix`". The package is built and then *run* —
  # `verify-vsix.mjs` unpacks it into a temp directory with no workspace above it
  # and makes the packaged bundle parse a real contract. A path that resolves in
  # this repo and not in the package is the failure this whole step exists for,
  # and it is invisible to every other job here.
  #
  # It also carries the notices check: the `.vsix` redistributes elkjs (EPL-2.0),
  # so `THIRD-PARTY-NOTICES.md` being current is a property of the artifact
  # rather than a chore.
  vsix:
    name: packaged extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notices:check
      - run: pnpm build
      - run: pnpm package:vsix
      - run: pnpm verify:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: axiomap-vsix
          path: dist/*.vsix

  # §7's Phase 9 exit criterion: "a stranger can `npm i -g @axiomap/cli`, run it
  # on their protocol, and understand what they are looking at without asking
  # you." Nothing here has actually published anything, so this is the npm
  # sibling of the `vsix` job above — pack the three publishable packages for
  # real, install them into a directory with no workspace above it and no
  # `workspace:*` protocol, and run the CLI end to end.
  npm-pack:
    name: packaged npm tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm notices:check
      - run: pnpm build
      - run: pnpm verify:npm-pack
